name: STRATA Sustainability & Real-Browser Verification

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify-browser-and-pdfium:
    name: Chromium E2E (1440x900 + 390x844) & Regression Suite
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned pypdfium2 + Apache-2.0 CJK font (worker + OS fontconfig)
        run: |
          ./scripts/setup/install-python-deps.sh
          mkdir -p "$HOME/.local/share/fonts"
          cp vendor/fonts/wqy-microhei/wqy-microhei.ttc "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts" || true

      - name: Execute automated backend, PDFium & architecture test suite
        working-directory: apps/contentvault-api
        run: |
          npm ci --no-audit --no-fund
          npm run seed
          npm test

      - name: Install Playwright & resolve Chromium / Chrome binary
        run: |
          mkdir -p /tmp/pw-runner
          cd /tmp/pw-runner
          npm init -y
          npm install --no-audit --no-fund playwright@1.65.1
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            npx playwright install chromium
          fi

      - name: Run genuine Chromium Desktop (1440x900) & Mobile (390x844) E2E suite
        env:
          CV_REQUIRE_BROWSER: "1"
          CV_PLAYWRIGHT_MODULE: "/tmp/pw-runner/node_modules/playwright/index.mjs"
        run: node scripts/verification/playwright-e2e.mjs --strict

      - name: Upload genuine Chromium browser screenshots & verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-browser-evidence
          path: reports/browser-screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Persist genuine Chromium browser evidence to active branch
        if: github.event_name == 'push' && github.ref_name == 'arena/85a94944-strata-medical-ai-lab'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/browser-screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "chore(004-phase-b): capture genuine Chromium 1440x900 and 390x844 evidence [skip ci]"
            git push origin HEAD:arena/85a94944-strata-medical-ai-lab
          fi

  verify-postgres16-rls:
    name: PostgreSQL 16 Row-Level Security & Append-Only Audit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strata_owner
          POSTGRES_PASSWORD: strata_ci_ephemeral_pw
          POSTGRES_DB: contentvault_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python 3.11 & pypdfium2 worker dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API & Python dependencies
        run: |
          ./scripts/setup/install-python-deps.sh
          npm --prefix apps/contentvault-api ci --no-audit --no-fund

      - name: Verify Mission 004 PostgreSQL 16 RLS baseline script
        env:
          DATABASE_URL: "postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_ci"
          CV_PG_MODULE: "../../apps/contentvault-api/node_modules/pg/lib/index.js"
        run: node scripts/verification/verify-postgres-rls.mjs

      - name: Provision dedicated PG16 databases & execute 005-A HTTP App + 005-B cv_runtime Privilege + 005-E Backup/Restore Suites
        working-directory: apps/contentvault-api
        env:
          CV_PG_RUNTIME_PASSWORD: "cv_runtime_ci_ephemeral_pw_2026"
          CV_REQUIRE_GENUINE_PG: "1"
          CV_ENFORCE_DB_ROLE_SEPARATION: "1"
          CV_PG_SSL_MODE: "disable"
        run: |
          node -e '
            import("pg").then(async ({ default: pg }) => {
              const c = new pg.Client({ connectionString: "postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_ci" });
              await c.connect();
              await c.query("CREATE DATABASE contentvault_app_ci");
              await c.query("CREATE DATABASE contentvault_priv_ci");
              await c.query("CREATE DATABASE contentvault_restore_ci");
              await c.end();
            });
          '
          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_app_ci" \
            npm run migrate:pg
          DATABASE_URL="postgres://cv_runtime:cv_runtime_ci_ephemeral_pw_2026@127.0.0.1:5432/contentvault_app_ci" \
          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_app_ci" \
            node --test tests/phase-005-postgres-app.test.js

          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_priv_ci" \
            npm run migrate:pg
          DATABASE_URL="postgres://cv_runtime:cv_runtime_ci_ephemeral_pw_2026@127.0.0.1:5432/contentvault_priv_ci" \
          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_priv_ci" \
            node --test tests/phase-005-db-privileges.test.js

          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_restore_ci" \
            npm run migrate:pg
          DATABASE_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_app_ci" \
            node ../../scripts/operations/backup-restore.mjs backup-pg --out /tmp/pg-ci-backup
          node ../../scripts/operations/backup-restore.mjs verify --bundle /tmp/pg-ci-backup
          DATABASE_MIGRATION_URL="postgres://strata_owner:strata_ci_ephemeral_pw@127.0.0.1:5432/contentvault_restore_ci" \
            node ../../scripts/operations/backup-restore.mjs restore-pg --bundle /tmp/pg-ci-backup
